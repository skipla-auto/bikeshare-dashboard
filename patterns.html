<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時間帯パターン(平日/祝日)</title>
<meta name="description" content="対象5ポートの、時刻ごとの平均空き自転車台数を平日と祝日で比較する実データの可視化">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f1f6f4; --surface: #ffffff; --surface-2: #e7efec; --border: #d4ddd9;
    --text-primary: #12211d; --text-secondary: #4d625c; --text-muted: #82958f;
    --accent: #0e8a70; --accent-soft: #dcf2ec;
    --holiday: #a8632a; --holiday-soft: #f3e6d6;
    --critical: #d23c3c; --critical-soft: #fbe4e4;
    --shadow: 0 1px 2px rgba(18,33,29,.05), 0 8px 24px rgba(18,33,29,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1613; --surface: #16211d; --surface-2: #1c2a25; --border: #2b3b35;
      --text-primary: #eaf3f0; --text-secondary: #a7bcb5; --text-muted: #718a82;
      --accent: #45d9b6; --accent-soft: #163a30;
      --holiday: #b5793a; --holiday-soft: #33261a;
      --critical: #f2716f; --critical-soft: #3d1d1e;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1613; --surface: #16211d; --surface-2: #1c2a25; --border: #2b3b35;
    --text-primary: #eaf3f0; --text-secondary: #a7bcb5; --text-muted: #718a82;
    --accent: #45d9b6; --accent-soft: #163a30;
    --holiday: #b5793a; --holiday-soft: #33261a;
    --critical: #f2716f; --critical-soft: #3d1d1e;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text-primary);
    font-family: "Noto Sans JP", "Hiragino Sans", -apple-system, sans-serif;
    margin: 0; padding: 28px 20px 72px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .back-link { display: inline-block; font-size: 12.5px; color: var(--text-secondary); text-decoration: none; margin-bottom: 10px; }
  .back-link:hover { color: var(--accent); }
  h1 {
    font-family: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
    font-weight: 900; font-size: 26px; margin: 0 0 4px; text-wrap: balance;
  }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 18px; }

  .meta-bar {
    display: flex; flex-wrap: wrap; gap: 10px 22px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 12.5px; color: var(--text-secondary);
    box-shadow: var(--shadow);
  }
  .meta-bar strong { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  .legend-line { display: flex; align-items: center; gap: 20px; font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
  .legend-key { display: inline-flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 18px; height: 2px; display: inline-block; }
  .legend-swatch.weekday { background: var(--accent); }
  .legend-swatch.holiday { background-image: linear-gradient(to right, var(--holiday) 0 4px, transparent 4px 7px); background-size: 7px 2px; background-repeat: repeat-x; height: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 10px; box-shadow: var(--shadow); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .card-name { font-family: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif; font-weight: 700; font-size: 13px; line-height: 1.3; }
  .card-role { font-size: 10.5px; color: var(--text-muted); }

  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .gridline { stroke: var(--border); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 8.5px; font-family: "JetBrains Mono", monospace; }
  .line-weekday { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .line-holiday { fill: none; stroke: var(--holiday); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 4 3; }
  .dot-weekday { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
  .dot-holiday { fill: var(--holiday); stroke: var(--surface); stroke-width: 1.5; }
  .crosshair { stroke: var(--text-muted); stroke-width: 1; opacity: 0; pointer-events: none; }
  .hit { fill: transparent; }

  .tooltip {
    position: absolute; pointer-events: none; background: var(--text-primary); color: var(--bg);
    font-size: 11px; line-height: 1.55; padding: 6px 9px; border-radius: 7px; white-space: nowrap;
    transform: translate(-50%, -100%); opacity: 0; transition: opacity .08s ease; z-index: 10;
    font-variant-numeric: tabular-nums;
  }
  .tooltip strong { font-weight: 700; }
  .tooltip .k-weekday { color: #6ee8c9; }
  .tooltip .k-holiday { color: #e8b784; }

  .table-toggle {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
    font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 10px;
  }
  .table-toggle:hover { color: var(--text-primary); border-color: var(--accent); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 500; font-size: 10.5px; text-transform: uppercase; }
  td { font-variant-numeric: tabular-nums; }

  footer { margin-top: 24px; font-size: 11.5px; color: var(--text-muted); line-height: 1.7; }
  footer a { color: var(--text-secondary); }

  .onset-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px 12px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .onset-head h2 {
    font-family: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
    font-weight: 700; font-size: 15px; margin: 0 0 2px;
  }
  .onset-sub { font-size: 11.5px; color: var(--text-muted); margin: 0 0 6px; }
  svg.onset-chart { display: block; width: 100%; height: auto; overflow: visible; }
  .onset-gridline { stroke: var(--border); stroke-width: 1; }
  .onset-axis-label { fill: var(--text-muted); font-size: 9px; font-family: "JetBrains Mono", monospace; }
  .onset-row-label { fill: var(--text-primary); font-size: 11px; font-weight: 700; font-family: "Noto Sans JP", sans-serif; }
  .onset-row-role { fill: var(--text-muted); font-size: 9.5px; font-family: "Noto Sans JP", sans-serif; }
  .onset-range { stroke: var(--critical); stroke-width: 3; stroke-linecap: round; opacity: 0.35; }
  .onset-dot { fill: var(--critical); stroke: var(--surface); stroke-width: 2; }
  .onset-dot-label { fill: var(--text-secondary); font-size: 9.5px; font-family: "JetBrains Mono", monospace; }
  .onset-none { fill: var(--text-muted); font-size: 10.5px; font-family: "Noto Sans JP", sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="trends.html">← 推移ページに戻る</a>
  <h1>時間帯パターン(平日/祝日)</h1>
  <p class="subtitle">ポートごとの時刻別・平均空き自転車台数。実際に収集したデータのみ使用しています</p>

  <div class="meta-bar" id="metaBar">読み込み中…</div>

  <div class="onset-card" id="onsetCard" hidden>
    <div class="onset-head">
      <h2>いつからダメになるか</h2>
      <p class="onset-sub">平日の朝(5〜13時)、各ポートで初めて「借りられない/返せない」になった時刻</p>
    </div>
    <svg class="onset-chart" id="onsetChart" viewBox="0 0 640 190" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="legend-line">
    <span class="legend-key"><span class="legend-swatch weekday"></span>平日</span>
    <span class="legend-key"><span class="legend-swatch holiday"></span>祝日</span>
  </div>

  <div class="grid" id="grid"></div>

  <button class="table-toggle" id="tableToggle" type="button" hidden>生データを表で見る</button>
  <div class="table-wrap" id="tableWrap" hidden>
    <table>
      <thead><tr><th>ポート</th><th>区分</th><th>時</th><th>平均台数</th><th>サンプル数</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer id="footerNote">
    データ提供: 公共交通オープンデータセンター(ODPT)/ドコモ・バイクシェア GBFS フィード(CC BY 4.0)。<br>
    各時間帯のサンプル数(n)が少ないうちは参考程度に見てください。表示していない時間帯はまだ記録がありません。
  </footer>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function () {
  "use strict";

  var grid = document.getElementById("grid");
  var metaBar = document.getElementById("metaBar");
  var tooltip = document.getElementById("tooltip");
  var tableToggle = document.getElementById("tableToggle");
  var tableWrap = document.getElementById("tableWrap");
  var tableBody = document.getElementById("tableBody");

  var ROLE_LABELS = {
    near_station: "駅近く", residential_origin: "住宅街", office_district: "オフィス街", reference: "参考"
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function parseNdjson(text) {
    return text.split("\n").filter(function (l) { return l.trim(); }).map(function (l) { return JSON.parse(l); });
  }

  var ONSET_WINDOW_START = 5, ONSET_WINDOW_END = 13; // JST hours to search within

  function jstHourFraction(ts) {
    var d = new Date(ts);
    var jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
    return jst.getUTCHours() + jst.getUTCMinutes() / 60;
  }
  function jstTimeLabel(ts) {
    var d = new Date(ts);
    var jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
    var h = jst.getUTCHours(), m = jst.getUTCMinutes();
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }

  function renderOnsetChart(stations, allRows) {
    var card = document.getElementById("onsetCard");
    var svg = document.getElementById("onsetChart");
    var weekdayRows = allRows.filter(function (r) { return !r.is_holiday; });
    if (weekdayRows.length === 0) { card.hidden = true; return; }

    // metric: office_district / near_station -> docks (fills up, can't return)
    //         residential_origin (and anything else) -> bikes (runs dry, can't rent)
    function metricFor(role) { return (role === "office_district" || role === "near_station") ? "docks_available" : "bikes_available"; }
    function labelFor(role) { return metricFor(role) === "docks_available" ? "満車(返却不可)" : "空(貸出不可)"; }

    var byStationDate = {};
    weekdayRows.forEach(function (r) {
      byStationDate[r.station_id] = byStationDate[r.station_id] || {};
      (byStationDate[r.station_id][r.date_jst] = byStationDate[r.station_id][r.date_jst] || []).push(r);
    });

    var rowsOut = stations.map(function (s) {
      var metric = metricFor(s.role);
      var byDate = byStationDate[s.station_id] || {};
      var onsets = [];
      Object.keys(byDate).forEach(function (date) {
        var recs = byDate[date].filter(function (r) {
          var hf = jstHourFraction(r.ts);
          return hf >= ONSET_WINDOW_START && hf < ONSET_WINDOW_END;
        }).sort(function (a, b) { return a.ts.localeCompare(b.ts); });
        var firstBad = recs.filter(function (r) { return r[metric] === 0; })[0];
        if (firstBad) onsets.push({ date: date, ts: firstBad.ts, hf: jstHourFraction(firstBad.ts), label: jstTimeLabel(firstBad.ts) });
      });
      return { station: s, metric: metric, metricLabel: labelFor(s.role), onsets: onsets };
    });

    if (rowsOut.every(function (r) { return r.onsets.length === 0; })) { card.hidden = true; return; }
    card.hidden = false;

    var W = 680, rowH = 34, padTop = 14, padBottom = 22, labelW = 225;
    var H = padTop + padBottom + rowH * rowsOut.length;
    var plotL = labelW, plotR = W - 12, plotW = plotR - plotL;

    function xFor(hf) { return plotL + ((hf - ONSET_WINDOW_START) / (ONSET_WINDOW_END - ONSET_WINDOW_START)) * plotW; }

    var svgParts = [];
    svgParts.push('<line class="onset-gridline" x1="' + plotL + '" y1="' + padTop + '" x2="' + plotL + '" y2="' + (H - padBottom) + '"></line>');
    for (var h = ONSET_WINDOW_START; h <= ONSET_WINDOW_END; h++) {
      var x = xFor(h);
      svgParts.push('<line class="onset-gridline" x1="' + x + '" y1="' + padTop + '" x2="' + x + '" y2="' + (H - padBottom + 4) + '"></line>');
      svgParts.push('<text class="onset-axis-label" x="' + x + '" y="' + (H - padBottom + 16) + '" text-anchor="middle">' + h + '時</text>');
    }

    rowsOut.forEach(function (r, i) {
      var cy = padTop + rowH * i + rowH / 2;
      svgParts.push('<text class="onset-row-label" x="0" y="' + (cy - 3) + '">' + escapeHtml(r.station.name.replace(/^[A-Z0-9-]+\./, "")) + '</text>');
      svgParts.push('<text class="onset-row-role" x="0" y="' + (cy + 10) + '">' + escapeHtml(r.metricLabel) + '</text>');
      if (r.onsets.length === 0) {
        svgParts.push('<text class="onset-none" x="' + plotL + '" y="' + (cy + 4) + '">5〜13時は発生せず</text>');
        return;
      }
      var xs = r.onsets.map(function (o) { return xFor(o.hf); });
      if (xs.length > 1) {
        svgParts.push('<line class="onset-range" x1="' + Math.min.apply(null, xs) + '" y1="' + cy + '" x2="' + Math.max.apply(null, xs) + '" y2="' + cy + '"></line>');
      }
      r.onsets.forEach(function (o) {
        var x = xFor(o.hf);
        svgParts.push('<circle class="onset-dot" cx="' + x + '" cy="' + cy + '" r="5"><title>' + o.date + ' ' + o.label + '</title></circle>');
      });
      var labelText = r.onsets.map(function (o) { return o.label; }).join(" / ");
      svgParts.push('<text class="onset-dot-label" x="' + (Math.max.apply(null, xs) + 10) + '" y="' + (cy + 4) + '">' + escapeHtml(labelText) + '</text>');
    });

    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML = svgParts.join("");
  }

  Promise.all([
    fetch("data/tracked-stations.json", { cache: "no-store" }).then(function (r) { return r.json(); }),
    fetch("data/history.ndjson", { cache: "no-store" }).then(function (r) { return r.text(); })
  ]).then(function (results) {
    var stations = results[0];
    var trackedIds = stations.map(function (s) { return s.station_id; });
    var rows = parseNdjson(results[1]).filter(function (r) { return trackedIds.indexOf(r.station_id) !== -1; });

    if (rows.length === 0) {
      metaBar.textContent = "まだ収集データがありません。";
      return;
    }

    // aggregate: station_id -> hour -> {weekday:[vals], holiday:[vals]}
    var agg = {};
    stations.forEach(function (s) { agg[s.station_id] = {}; for (var h = 0; h < 24; h++) agg[s.station_id][h] = { weekday: [], holiday: [] }; });
    rows.forEach(function (r) {
      var bucket = agg[r.station_id][r.hour_jst];
      (r.is_holiday ? bucket.holiday : bucket.weekday).push(r.bikes_available);
    });

    var weekdayDates = {}, holidayDates = {};
    rows.forEach(function (r) { (r.is_holiday ? holidayDates : weekdayDates)[r.date_jst] = 1; });
    var wdCount = Object.keys(weekdayDates).length, hdCount = Object.keys(holidayDates).length;

    metaBar.innerHTML =
      "<span>平日 <strong>" + wdCount + "</strong>日分</span>" +
      "<span>祝日 <strong>" + hdCount + "</strong>日分</span>" +
      "<span>総記録行数 <strong>" + rows.length + "</strong></span>";

    function avg(arr) { return arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : null; }

    renderOnsetChart(stations, rows);

    var tableRows = [];
    var W = 320, H = 130, PAD_L = 22, PAD_R = 8, PAD_T = 10, PAD_B = 16;
    var plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;

    stations.forEach(function (s) {
      var hourly = agg[s.station_id];
      var maxVal = 1;
      var wdPoints = [], hdPoints = [];
      for (var h = 0; h < 24; h++) {
        var wdAvg = avg(hourly[h].weekday), hdAvg = avg(hourly[h].holiday);
        if (wdAvg !== null) { wdPoints.push({ h: h, v: wdAvg, n: hourly[h].weekday.length }); maxVal = Math.max(maxVal, wdAvg); }
        if (hdAvg !== null) { hdPoints.push({ h: h, v: hdAvg, n: hourly[h].holiday.length }); maxVal = Math.max(maxVal, hdAvg); }
        if (wdAvg !== null) tableRows.push({ name: s.name, kind: "平日", h: h, avg: wdAvg, n: hourly[h].weekday.length });
        if (hdAvg !== null) tableRows.push({ name: s.name, kind: "祝日", h: h, avg: hdAvg, n: hourly[h].holiday.length });
      }
      maxVal = Math.ceil(maxVal * 1.15);

      function xFor(h) { return PAD_L + (h / 23) * plotW; }
      function yFor(v) { return PAD_T + plotH - (v / maxVal) * plotH; }

      function pathFor(points) {
        var segs = [], cur = [];
        var prevH = null;
        points.forEach(function (p) {
          if (prevH !== null && p.h - prevH > 1) { if (cur.length) segs.push(cur); cur = []; }
          cur.push(p);
          prevH = p.h;
        });
        if (cur.length) segs.push(cur);
        return segs.map(function (seg) {
          return seg.map(function (p, i) { return (i === 0 ? "M" : "L") + xFor(p.h).toFixed(1) + "," + yFor(p.v).toFixed(1); }).join(" ");
        }).join(" ");
      }

      var wdPath = pathFor(wdPoints), hdPath = pathFor(hdPoints);
      var dots = wdPoints.map(function (p) { return '<circle class="dot-weekday" cx="' + xFor(p.h).toFixed(1) + '" cy="' + yFor(p.v).toFixed(1) + '" r="2.5"></circle>'; }).join("") +
                 hdPoints.map(function (p) { return '<circle class="dot-holiday" cx="' + xFor(p.h).toFixed(1) + '" cy="' + yFor(p.v).toFixed(1) + '" r="2.5"></circle>'; }).join("");
      var hitTargets = [];
      for (var h2 = 0; h2 < 24; h2 += 3) hitTargets.push(h2);
      var hits = hitTargets.map(function (h) { return '<circle class="hit" cx="' + xFor(h).toFixed(1) + '" cy="' + (PAD_T + plotH / 2) + '" r="14"></circle>'; }).join("");

      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="card-head">' +
          '<div class="card-name">' + escapeHtml(s.name) + '</div>' +
          '<div class="card-role">' + escapeHtml(ROLE_LABELS[s.role] || "") + '</div>' +
        '</div>' +
        '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
          '<line class="gridline" x1="' + PAD_L + '" y1="' + (PAD_T + plotH) + '" x2="' + (W - PAD_R) + '" y2="' + (PAD_T + plotH) + '"></line>' +
          '<text class="axis-label" x="' + PAD_L + '" y="' + (PAD_T - 2) + '">' + maxVal + '台</text>' +
          '<text class="axis-label" x="' + PAD_L + '" y="' + (H - 3) + '">0時</text>' +
          '<text class="axis-label" x="' + xFor(12) + '" y="' + (H - 3) + '" text-anchor="middle">12時</text>' +
          '<text class="axis-label" x="' + (W - PAD_R) + '" y="' + (H - 3) + '" text-anchor="end">23時</text>' +
          '<path class="line-weekday" d="' + wdPath + '"></path>' +
          '<path class="line-holiday" d="' + hdPath + '"></path>' +
          dots +
          hits +
        '</svg>';
      grid.appendChild(card);

      var svg = card.querySelector("svg");
      svg.addEventListener("pointermove", function (evt) {
        var rect = svg.getBoundingClientRect();
        var relX = ((evt.clientX - rect.left) / rect.width) * W;
        var h = Math.round(((relX - PAD_L) / plotW) * 23);
        h = Math.max(0, Math.min(23, h));
        var wd = hourly[h].weekday, hd = hourly[h].holiday;
        var wdAvg = avg(wd), hdAvg = avg(hd);
        if (wdAvg === null && hdAvg === null) { tooltip.style.opacity = "0"; return; }
        var html = "<div>" + h + "時台</div>";
        if (wdAvg !== null) html += '<div class="k-weekday">平日: <strong>' + wdAvg.toFixed(1) + '台</strong> (n=' + wd.length + ')</div>';
        if (hdAvg !== null) html += '<div class="k-holiday">祝日: <strong>' + hdAvg.toFixed(1) + '台</strong> (n=' + hd.length + ')</div>';
        tooltip.innerHTML = html;
        tooltip.style.left = evt.clientX + "px";
        tooltip.style.top = (rect.top + window.scrollY - 6) + "px";
        tooltip.style.opacity = "1";
      });
      svg.addEventListener("pointerleave", function () { tooltip.style.opacity = "0"; });
    });

    tableBody.innerHTML = tableRows.map(function (r) {
      return "<tr><td>" + escapeHtml(r.name) + "</td><td>" + r.kind + "</td><td>" + r.h + "時</td><td>" + r.avg.toFixed(1) + "台</td><td>" + r.n + "</td></tr>";
    }).join("");
    tableToggle.hidden = false;
    tableToggle.addEventListener("click", function () {
      var show = tableWrap.hidden;
      tableWrap.hidden = !show;
      tableToggle.textContent = show ? "生データを隠す" : "生データを表で見る";
    });
  }).catch(function (err) {
    metaBar.textContent = "データの取得に失敗しました。";
    console.error(err);
  });
})();
</script>
</body>
</html>
