<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空き状況の推移</title>
<meta name="description" content="登録ポートの自転車・ドック空き数の推移を、収集した実データから表示する">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f1f6f4;
    --surface: #ffffff;
    --surface-2: #e7efec;
    --border: #d4ddd9;
    --text-primary: #12211d;
    --text-secondary: #4d625c;
    --text-muted: #82958f;

    --accent: #0e8a70;
    --accent-soft: #dcf2ec;
    --accent-ink: #ffffff;

    --rain: #3f7fc9;
    --rain-soft: #dbe9f8;

    --shadow: 0 1px 2px rgba(18, 33, 29, 0.05), 0 8px 24px rgba(18, 33, 29, 0.07);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1613;
      --surface: #16211d;
      --surface-2: #1c2a25;
      --border: #2b3b35;
      --text-primary: #eaf3f0;
      --text-secondary: #a7bcb5;
      --text-muted: #718a82;

      --accent: #45d9b6;
      --accent-soft: #163a30;
      --accent-ink: #08201a;

      --rain: #7fb2ea;
      --rain-soft: #17293e;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0e1613;
    --surface: #16211d;
    --surface-2: #1c2a25;
    --border: #2b3b35;
    --text-primary: #eaf3f0;
    --text-secondary: #a7bcb5;
    --text-muted: #718a82;

    --accent: #45d9b6;
    --accent-soft: #163a30;
    --accent-ink: #08201a;

    --rain: #7fb2ea;
    --rain-soft: #17293e;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Noto Sans JP", "Hiragino Sans", -apple-system, sans-serif;
    margin: 0;
    padding: 28px 20px 72px;
  }

  .wrap { max-width: 1000px; margin: 0 auto; }

  header { margin-bottom: 6px; }

  .back-link {
    display: inline-block;
    font-size: 12.5px;
    color: var(--text-secondary);
    text-decoration: none;
    margin-bottom: 10px;
  }
  .back-link:hover { color: var(--accent); }

  h1 {
    font-family: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
    font-weight: 900;
    font-size: 26px;
    margin: 0 0 4px;
    text-wrap: balance;
  }

  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 18px; }

  .meta-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 22px;
    font-size: 12.5px;
    color: var(--text-secondary);
    box-shadow: var(--shadow);
  }
  .meta-bar strong { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  .legend-line {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .legend-key { display: inline-flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 16px; height: 2px; background: var(--accent); border-radius: 1px; display: inline-block; }
  .legend-swatch.rain { background: var(--rain); height: 8px; width: 8px; border-radius: 50%; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    margin-bottom: 26px;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px 10px;
    box-shadow: var(--shadow);
  }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
  }

  .card-name {
    font-family: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    line-height: 1.3;
  }

  .card-latest {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 16px;
    color: var(--accent);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .gridline { stroke: var(--border); stroke-width: 1; }
  .capacity-line { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .capacity-label { fill: var(--text-muted); font-size: 8.5px; font-family: "JetBrains Mono", monospace; }
  .series-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .series-area { fill: var(--accent); opacity: 0.1; }
  .end-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .hit { fill: transparent; }
  .crosshair { stroke: var(--text-muted); stroke-width: 1; opacity: 0; pointer-events: none; }
  .axis-label { fill: var(--text-muted); font-size: 8.5px; font-family: "JetBrains Mono", monospace; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--text-primary);
    color: var(--bg);
    font-size: 11.5px;
    line-height: 1.5;
    padding: 6px 9px;
    border-radius: 7px;
    white-space: nowrap;
    transform: translate(-50%, -100%);
    opacity: 0;
    transition: opacity .08s ease;
    z-index: 10;
    font-variant-numeric: tabular-nums;
  }
  .tooltip strong { font-weight: 700; }

  .table-toggle {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    font: inherit;
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .table-toggle:hover { color: var(--text-primary); border-color: var(--accent); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  td { font-variant-numeric: tabular-nums; color: var(--text-primary); }
  td.name-cell { font-variant-numeric: normal; }

  footer { margin-top: 26px; font-size: 11.5px; color: var(--text-muted); line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back-link" href="index.html">← ライブ表示に戻る</a>
    <h1>空き状況の推移</h1>
    <p class="subtitle">登録ポートの自転車・ドック空き数を、実際に収集したデータでそのまま表示しています</p>
  </header>

  <div class="meta-bar" id="metaBar">読み込み中…</div>

  <div class="legend-line">
    <span class="legend-key"><span class="legend-swatch"></span>利用可能な自転車(台)</span>
    <span class="legend-key"><span class="legend-swatch rain"></span>降水あり(1mm/h以上)</span>
    <span>点線 = このポートで観測された最大台数</span>
  </div>

  <div class="grid" id="grid"></div>

  <button class="table-toggle" id="tableToggle" type="button" hidden>生データを表で見る</button>
  <div class="table-wrap" id="tableWrap" hidden>
    <table>
      <thead>
        <tr><th>日時(JST)</th><th>ポート</th><th>自転車</th><th>ドック</th><th>天気</th><th>気温</th><th>祝日</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer id="footerNote">
    データ提供: 公共交通オープンデータセンター(ODPT)/ドコモ・バイクシェア GBFS フィード(CC BY 4.0)、気象データ: Open-Meteo。<br>
    自宅のMac上で毎時1回、ライブAPIから取得して記録しています(スリープ中は記録が止まります)。
  </footer>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function () {
  "use strict";

  var WEATHER_LABELS = {
    0: "快晴", 1: "晴れ", 2: "薄曇り", 3: "曇り",
    45: "霧", 48: "霧氷",
    51: "小雨", 53: "雨", 55: "強い雨",
    61: "雨", 63: "雨", 65: "強い雨",
    71: "雪", 73: "雪", 75: "強い雪",
    80: "にわか雨", 81: "にわか雨", 82: "激しいにわか雨",
    95: "雷雨"
  };

  var grid = document.getElementById("grid");
  var metaBar = document.getElementById("metaBar");
  var tooltip = document.getElementById("tooltip");
  var tableToggle = document.getElementById("tableToggle");
  var tableWrap = document.getElementById("tableWrap");
  var tableBody = document.getElementById("tableBody");
  var footerNote = document.getElementById("footerNote");

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    return d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function fmtTimeShort(ts) {
    var d = new Date(ts);
    return d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit" });
  }

  function parseNdjson(text) {
    return text.split("\n").filter(function (l) { return l.trim(); }).map(function (l) { return JSON.parse(l); });
  }

  Promise.all([
    fetch("data/tracked-stations.json", { cache: "no-store" }).then(function (r) { return r.json(); }),
    fetch("data/history.ndjson", { cache: "no-store" }).then(function (r) { return r.text(); })
  ]).then(function (results) {
    var stations = results[0];
    var rows = parseNdjson(results[1]);

    if (rows.length === 0) {
      metaBar.textContent = "まだ収集データがありません。次回の自動収集をお待ちください。";
      return;
    }

    var byStation = {};
    rows.forEach(function (r) {
      (byStation[r.station_id] = byStation[r.station_id] || []).push(r);
    });
    Object.keys(byStation).forEach(function (id) {
      byStation[id].sort(function (a, b) { return a.ts.localeCompare(b.ts); });
    });

    var allTimes = rows.map(function (r) { return new Date(r.ts).getTime(); });
    var tMin = Math.min.apply(null, allTimes);
    var tMax = Math.max.apply(null, allTimes);
    var runCount = Object.keys(rows.reduce(function (acc, r) { acc[r.ts] = 1; return acc; }, {})).length;
    var holidaySet = rows.some(function (r) { return r.is_holiday; });
    var allHoliday = rows.every(function (r) { return r.is_holiday; });

    var holidayNote = allHoliday ? "この期間はすべて祝日でした(比較対象なし)" :
      (holidaySet ? "祝日/平日どちらのデータも含みます" : "この期間は祝日を含みません");

    metaBar.innerHTML =
      "<span>記録回数 <strong>" + runCount + "</strong>回</span>" +
      "<span>期間 <strong>" + escapeHtml(fmtTime(tMin)) + "</strong> 〜 <strong>" + escapeHtml(fmtTime(tMax)) + "</strong>(JST)</span>" +
      "<span>" + escapeHtml(holidayNote) + "</span>";

    // Table (shared, all stations)
    var allRowsSorted = rows.slice().sort(function (a, b) { return b.ts.localeCompare(a.ts); });
    var tbodyHtml = allRowsSorted.map(function (r) {
      var w = WEATHER_LABELS[r.weather_code] || "-";
      return "<tr>" +
        "<td>" + escapeHtml(fmtTime(r.ts)) + "</td>" +
        "<td class=\"name-cell\">" + escapeHtml(r.name) + "</td>" +
        "<td>" + r.bikes_available + "</td>" +
        "<td>" + r.docks_available + "</td>" +
        "<td>" + escapeHtml(w) + (r.precip_mm > 0 ? " (" + r.precip_mm + "mm)" : "") + "</td>" +
        "<td>" + (r.temp_c != null ? r.temp_c + "℃" : "-") + "</td>" +
        "<td>" + (r.is_holiday ? "祝日" : "平日") + "</td>" +
        "</tr>";
    }).join("");
    tableBody.innerHTML = tbodyHtml;
    tableToggle.hidden = false;
    tableToggle.addEventListener("click", function () {
      var show = tableWrap.hidden;
      tableWrap.hidden = !show;
      tableToggle.textContent = show ? "生データを隠す" : "生データを表で見る";
    });

    // Charts, ordered per tracked-stations.json
    var W = 320, H = 130, PAD_L = 26, PAD_R = 10, PAD_T = 10, PAD_B = 18;
    var plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;

    stations.forEach(function (s) {
      var data = byStation[s.station_id];
      if (!data || data.length === 0) return;

      var maxCap = Math.max.apply(null, data.map(function (d) { return d.bikes_available + d.docks_available; }));
      var yMax = Math.max(maxCap, 1);

      function xFor(ts) {
        var t = new Date(ts).getTime();
        var frac = tMax > tMin ? (t - tMin) / (tMax - tMin) : 0.5;
        return PAD_L + frac * plotW;
      }
      function yFor(v) {
        return PAD_T + plotH - (v / yMax) * plotH;
      }

      var points = data.map(function (d) { return { x: xFor(d.ts), y: yFor(d.bikes_available), d: d }; });
      var linePath = points.map(function (p, i) { return (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
      var areaPath = linePath + " L" + points[points.length - 1].x.toFixed(1) + "," + (PAD_T + plotH) + " L" + points[0].x.toFixed(1) + "," + (PAD_T + plotH) + " Z";

      var rainMarks = points.filter(function (p) { return p.d.precip_mm > 0; })
        .map(function (p) { return "<circle class=\"rain-dot\" cx=\"" + p.x.toFixed(1) + "\" cy=\"" + (PAD_T - 4) + "\" r=\"3\" fill=\"var(--rain)\"></circle>"; })
        .join("");

      var last = points[points.length - 1];

      var svgId = "chart-" + s.station_id;
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        "<div class=\"card-head\">" +
          "<div class=\"card-name\">" + escapeHtml(s.name) + "</div>" +
          "<div class=\"card-latest\">" + last.d.bikes_available + "<span style=\"font-size:10px;color:var(--text-muted);font-weight:500;\">台</span></div>" +
        "</div>" +
        "<svg class=\"chart\" id=\"" + svgId + "\" viewBox=\"0 0 " + W + " " + H + "\" preserveAspectRatio=\"none\">" +
          "<line class=\"gridline\" x1=\"" + PAD_L + "\" y1=\"" + (PAD_T + plotH) + "\" x2=\"" + (W - PAD_R) + "\" y2=\"" + (PAD_T + plotH) + "\"></line>" +
          "<line class=\"capacity-line\" x1=\"" + PAD_L + "\" y1=\"" + PAD_T + "\" x2=\"" + (W - PAD_R) + "\" y2=\"" + PAD_T + "\"></line>" +
          "<text class=\"capacity-label\" x=\"" + (W - PAD_R) + "\" y=\"" + (PAD_T - 2) + "\" text-anchor=\"end\">" + yMax + "台</text>" +
          "<text class=\"axis-label\" x=\"" + PAD_L + "\" y=\"" + (H - 4) + "\">0</text>" +
          rainMarks +
          "<path class=\"series-area\" d=\"" + areaPath + "\"></path>" +
          "<path class=\"series-line\" d=\"" + linePath + "\"></path>" +
          "<circle class=\"end-dot\" cx=\"" + last.x.toFixed(1) + "\" cy=\"" + last.y.toFixed(1) + "\" r=\"4\"></circle>" +
          "<line class=\"crosshair\" y1=\"" + PAD_T + "\" y2=\"" + (PAD_T + plotH) + "\"></line>" +
          points.map(function (p) { return "<circle class=\"hit\" cx=\"" + p.x.toFixed(1) + "\" cy=\"" + PAD_T + "\" r=\"12\" height=\"" + plotH + "\"></circle>"; }).join("") +
        "</svg>";
      grid.appendChild(card);

      var svg = card.querySelector("svg");
      var crosshair = svg.querySelector(".crosshair");

      function showTooltip(p, clientX, clientY) {
        var w = WEATHER_LABELS[p.d.weather_code] || "";
        tooltip.innerHTML =
          "<div><strong>" + p.d.bikes_available + "台</strong>利用可能(空きドック " + p.d.docks_available + ")</div>" +
          "<div>" + escapeHtml(fmtTimeShort(p.d.ts)) + (w ? " ・ " + escapeHtml(w) : "") + "</div>";
        tooltip.style.left = clientX + "px";
        tooltip.style.top = (clientY - 10) + "px";
        tooltip.style.opacity = "1";
        crosshair.setAttribute("x1", p.x);
        crosshair.setAttribute("x2", p.x);
        crosshair.style.opacity = "1";
      }
      function hideTooltip() {
        tooltip.style.opacity = "0";
        crosshair.style.opacity = "0";
      }

      svg.addEventListener("pointermove", function (evt) {
        var rect = svg.getBoundingClientRect();
        var relX = ((evt.clientX - rect.left) / rect.width) * W;
        var nearest = points[0], best = Infinity;
        points.forEach(function (p) {
          var dist = Math.abs(p.x - relX);
          if (dist < best) { best = dist; nearest = p; }
        });
        showTooltip(nearest, evt.clientX, rect.top + window.scrollY);
      });
      svg.addEventListener("pointerleave", hideTooltip);
    });

    if (allHoliday) {
      footerNote.innerHTML += "<br>注: 収集期間がまだ短く、全データが祝日のものです。祝日と平日の比較にはもう数日分のデータが必要です。";
    }
  }).catch(function (err) {
    metaBar.textContent = "データの取得に失敗しました。";
    console.error(err);
  });
})();
</script>
</body>
</html>
